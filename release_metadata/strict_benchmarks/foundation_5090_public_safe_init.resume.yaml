data:
  path: data/plant_foundation_corpus.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1024
  min_genes_per_cell: 40
  min_cells_per_gene: 10
  validation_fraction: 0.1
  test_fraction: 0.1
architecture:
  d_model: 512
  n_layers: 10
  n_heads: 8
  ffn_dim: 1536
  dropout: 0.1
  value_bins: 128
  gradient_checkpointing: true
train:
  stage: hybrid
  seed: 47
  epochs: 12
  batch_size: 4
  eval_batch_size: 8
  learning_rate: 8.0e-05
  head_learning_rate: 0.0003
  weight_decay: 0.04
  warmup_fraction: 0.06
  gradient_accumulation_steps: 12
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: full
  init_checkpoint: null
  label_smoothing: 0.04
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.1
  mlm_loss_weight: 0.25
  value_loss_weight: 0.08
  mask_ratio: 0.12
  class_balance: true
  early_stopping_patience: 4
  heartbeat_steps: 50
  latest_checkpoint_every_updates: 25
  num_workers: 2
  compile_model: false
  resume_checkpoint: outputs/foundation_5090_public_safe_init/latest.pt
output:
  directory: outputs/foundation_5090_public_safe_init
  save_every_epochs: 2
