data:
  path: /root/snowlotus_public_plants_v10/plant_foundation_corpus_public_plants_v10_shared_genes.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: dataset_id
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  ontology_contract: /mnt/snowlotus_cellfm/release_metadata/source_only/plant_cell_state_contract_v19.json
  ontology_unknown_policy: keep
  normalize_total: 10000.0
  log1p: true
  max_genes: 512
  min_genes_per_cell: 5
  min_cells_per_gene: 3
  validation_fraction: 0.10
  test_fraction: 0.10

architecture:
  d_model: 256
  n_layers: 4
  n_heads: 8
  ffn_dim: 768
  dropout: 0.10
  value_bins: 32
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  contrastive_dim: 128
  gradient_checkpointing: false
  marker_prior_weight: 0.12

train:
  stage: hybrid
  seed: 20260814
  epochs: 10
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 0.00001
  head_learning_rate: 0.00003
  weight_decay: 0.02
  warmup_fraction: 0.10
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: lora
  init_checkpoint: /root/snowlotus_cellfm_v9_lora_shared_4090/best.pt
  resume_checkpoint: null
  label_smoothing: 0.05
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.25
  value_loss_weight: 0.10
  contrastive_loss_weight: 0.30
  cross_species_contrastive_loss_weight: 0.20
  contrastive_temperature: 0.10
  hard_negative_loss_weight: 0.15
  hard_negative_margin: 0.20
  validation_metric: species_macro_f1
  hierarchy_inference_weight: 0.20
  unknown_calibration_alpha: 0.05
  mask_ratio: 0.15
  class_balance: true
  species_balance: true
  early_stopping_patience: 3
  max_train_batches_per_epoch: 8192
  max_eval_batches: 512
  heartbeat_steps: 128
  latest_checkpoint_every_updates: 512
  num_workers: 0
  compile_model: false

output:
  directory: /root/snowlotus_cellfm_v19_contrastive_4090
  save_every_epochs: 1
