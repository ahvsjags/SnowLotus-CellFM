data:
  path: data/plant_foundation_corpus_gse146034.npz
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: cell_id
  species_key: species
  tissue_key: tissue
  max_genes: 256
  min_genes_per_cell: 5
  min_cells_per_gene: 3
  validation_fraction: 0.15
  test_fraction: 0.15

architecture:
  d_model: 128
  n_layers: 2
  n_heads: 4
  ffn_dim: 320
  dropout: 0.10
  value_bins: 32

train:
  stage: hybrid
  seed: 20260727
  epochs: 1
  batch_size: 64
  eval_batch_size: 128
  learning_rate: 0.0005
  weight_decay: 0.02
  warmup_fraction: 0.10
  gradient_accumulation_steps: 1
  mixed_precision: "no"
  tuning_mode: full
  label_smoothing: 0.02
  coarse_loss_weight: 0.30
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.30
  value_loss_weight: 0.10
  mask_ratio: 0.15
  class_balance: true
  early_stopping_patience: 1
  max_train_batches_per_epoch: 4
  max_eval_batches: 2

output:
  directory: outputs/local_gse146034_smoke
  save_every_epochs: 0
