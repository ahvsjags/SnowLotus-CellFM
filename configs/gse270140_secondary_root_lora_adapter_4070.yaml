  gradient_checkpointing: false

train:
  stage: supervised
  seed: 20260801
  epochs: 10
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.00005
  head_learning_rate: 0.00020
  weight_decay: 0.02
  warmup_fraction: 0.10
