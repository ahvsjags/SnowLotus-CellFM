  tuning_mode: lora
  init_checkpoint: models/SnowLotus_CellFM_SRP169576_annotation_1024_best.pt
  resume_checkpoint: null
  label_smoothing: 0.03
  coarse_loss_weight: 0.25
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.0
  value_loss_weight: 0.0
  mask_ratio: 0.15
  class_balance: true
  early_stopping_patience: 3
  heartbeat_steps: 100
  latest_checkpoint_every_updates: 500
  num_workers: 0
  compile_model: false

output:
  directory: outputs/gse270140_secondary_root_lora_adapter_4070
  save_every_epochs: 1
