data:
  path: outputs/external_validation/gse270140/GSM8335426_JWE03_author_annotated_secondary_root.h5ad
  layer: null
  label_key: expert_annotation_raw
  coarse_label_key: expert_annotation_raw
  group_key: cell_id
  batch_key: source_orig_ident
  species_key: Organ
  tissue_key: Tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1024
  min_genes_per_cell: 20
  min_cells_per_gene: 5
  validation_fraction: 0.10
  test_fraction: 0.20
  split_strategy: group_random

