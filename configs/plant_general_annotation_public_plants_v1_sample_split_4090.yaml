data:
  path: data/plant_foundation_corpus_public_plants_v1.h5ad
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  species_key: species
  tissue_key: tissue
  max_genes: 512
  min_genes_per_cell: 5
  min_cells_per_gene: 3
  validation_fraction: 0.10
  test_fraction: 0.10

architecture:
  d_model: 256
  n_layers: 4
  n_heads: 8
  ffn_dim: 768
  dropout: 0.10
  value_bins: 32
  lora_rank: 0

train:
  stage: supervised
  seed: 20260730
  epochs: 8
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.001
  head_learning_rate: 0.001
  weight_decay: 0.01
  warmup_fraction: 0.10
  gradient_accumulation_steps: 4
  mixed_precision: bf16
  tuning_mode: head
  init_checkpoint: outputs/plant_general_foundation_public_plants_v1_4090/best.pt
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.0
  value_loss_weight: 0.0
  early_stopping_patience: 3
  class_balance: true
  max_train_batches_per_epoch: 4096
  max_eval_batches: 256

output:
  directory: outputs/plant_general_annotation_public_plants_v1_sample_split_4090
  save_every_epochs: 0
