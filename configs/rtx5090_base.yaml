data:
  path: data/saussurea_involucrata.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  batch_key: batch
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  ortholog_map: data/orthologs/source_to_plant_reference.tsv
  ortholog_source_column: source_gene
  ortholog_target_column: target_gene
  ortholog_confidence_column: confidence
  min_ortholog_confidence: 0.5
  ortholog_keep_unmapped: false
  normalize_total: 10000.0
  log1p: true
  max_genes: 1024
  min_genes_per_cell: 100
  min_cells_per_gene: 10
  validation_fraction: 0.10
  test_fraction: 0.10

architecture:
  d_model: 512
  n_layers: 12
  n_heads: 8
  ffn_dim: 1536
  dropout: 0.10
  value_bins: 128
  lora_rank: 0
  lora_alpha: 16.0
  lora_dropout: 0.05
  gradient_checkpointing: true

train:
  stage: hybrid
  seed: 42
  epochs: 60
  batch_size: 24
  eval_batch_size: 48
  learning_rate: 0.0002
  head_learning_rate: 0.0005
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: full
  train_last_n_layers: 4
  init_checkpoint: null
  label_smoothing: 0.05
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.40
  value_loss_weight: 0.15
  mask_ratio: 0.15
  class_balance: true
  early_stopping_patience: 8
  num_workers: 4
  compile_model: false

output:
  directory: outputs/rtx5090_base
  save_every_epochs: 5
