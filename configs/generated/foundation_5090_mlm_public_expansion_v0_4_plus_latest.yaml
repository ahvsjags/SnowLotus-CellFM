data:
  path: data/plant_foundation_corpus_public_mlm_plus_latest.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1536
  min_genes_per_cell: 80
  min_cells_per_gene: 20
  validation_fraction: 0.05
  test_fraction: 0.05
architecture:
  d_model: 512
  n_layers: 10
  n_heads: 8
  ffn_dim: 1536
  dropout: 0.1
  value_bins: 128
  gradient_checkpointing: true
train:
  stage: pretrain
  seed: 48
  epochs: 8
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 5.0e-05
  weight_decay: 0.05
  warmup_fraction: 0.04
  gradient_accumulation_steps: 18
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: full
  init_checkpoint: outputs/foundation_5090_mlm_public_expansion_continuation_v0_3_seed47_b8_vocabwarm/best.pt
  resume_checkpoint: null
  mlm_loss_weight: 1.0
  value_loss_weight: 0.2
  mask_ratio: 0.15
  early_stopping_patience: 5
  heartbeat_steps: 250
  latest_checkpoint_every_updates: 50
  num_workers: 4
  compile_model: false
output:
  directory: outputs/foundation_5090_mlm_public_expansion_v0_4_plus_latest_seed48_b8_vocabwarm
  save_every_epochs: 2
