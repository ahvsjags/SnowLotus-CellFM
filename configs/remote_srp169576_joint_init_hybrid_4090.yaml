data:
  path: data/public/scPlantDB_h5ad/SRP169576.h5ad
  layer: null
  label_key: Celltype
  coarse_label_key: Celltype
  group_key: Orig.ident
  species_key: Organ
  tissue_key: Tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1024
  min_genes_per_cell: 20
  min_cells_per_gene: 5
  validation_fraction: 0.15
  test_fraction: 0.15

architecture:
  d_model: 256
  n_layers: 4
  n_heads: 8
  ffn_dim: 768
  dropout: 0.10
  value_bins: 64
  gradient_checkpointing: false

train:
  stage: hybrid
  seed: 20260728
  epochs: 6
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 0.00005
  head_learning_rate: 0.00020
  weight_decay: 0.02
  warmup_fraction: 0.10
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: full
  init_checkpoint: outputs/remote_joint_scplantdb_pretrain_4090/best.pt
  label_smoothing: 0.02
  coarse_loss_weight: 0.25
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.35
  value_loss_weight: 0.10
  mask_ratio: 0.15
  class_balance: false
  early_stopping_patience: 3
  num_workers: 0
  compile_model: false

output:
  directory: outputs/remote_srp169576_joint_init_hybrid_4090
  save_every_epochs: 1
