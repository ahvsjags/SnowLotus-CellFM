data:
  path: data/saussurea_involucrata.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1536
  min_genes_per_cell: 80
  min_cells_per_gene: 10
  validation_fraction: 0.10
  test_fraction: 0.10

architecture:
  d_model: 768
  n_layers: 16
  n_heads: 12
  ffn_dim: 2304
  dropout: 0.10
  value_bins: 128
  lora_rank: 16
  lora_alpha: 32.0
  lora_dropout: 0.05
  gradient_checkpointing: true

train:
  stage: hybrid
  seed: 43
  epochs: 50
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.00008
  head_learning_rate: 0.0003
  weight_decay: 0.03
  warmup_fraction: 0.05
  gradient_accumulation_steps: 12
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: lora
  init_checkpoint: outputs/foundation_5090_pretrain/best.pt
  label_smoothing: 0.03
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.25
  value_loss_weight: 0.10
  mask_ratio: 0.15
  class_balance: true
  early_stopping_patience: 8
  num_workers: 6
  compile_model: false

output:
  directory: outputs/saussurea_lora_finetune
  save_every_epochs: 5
