data:
  path: data/plant_foundation_corpus.h5ad
  layer: null
  label_key: cell_type
  coarse_label_key: cell_type_coarse
  group_key: sample_id
  species_key: species
  tissue_key: tissue
  cell_id_key: cell_id
  normalize_total: 10000.0
  log1p: true
  max_genes: 1536
  min_genes_per_cell: 80
  min_cells_per_gene: 20
  validation_fraction: 0.05
  test_fraction: 0.05

architecture:
  d_model: 768
  n_layers: 16
  n_heads: 12
  ffn_dim: 2304
  dropout: 0.10
  value_bins: 128
  gradient_checkpointing: true

train:
  stage: hybrid
  seed: 42
  epochs: 80
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 0.00012
  head_learning_rate: 0.0004
  weight_decay: 0.05
  warmup_fraction: 0.06
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  mixed_precision: bf16
  tuning_mode: full
  label_smoothing: 0.05
  coarse_loss_weight: 0.35
  hierarchy_loss_weight: 0.10
  mlm_loss_weight: 0.45
  value_loss_weight: 0.15
  mask_ratio: 0.15
  class_balance: true
  early_stopping_patience: 10
  num_workers: 6
  compile_model: false

output:
  directory: outputs/foundation_5090_pretrain
  save_every_epochs: 5
